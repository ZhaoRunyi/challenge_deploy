[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "challenge_deploy"
version = "0.1.0"
description = "ROS-free Piper deployment and HDF5 teleop data collection utilities for challenge_ws."
requires-python = ">=3.10,<3.11"
dependencies = [
    "h5py",
    "imageio",
    "imageio-ffmpeg",
    "matplotlib",
    "msgpack",
    "numpy<2",
    "opencv-python==4.11.0.86",
    "Pillow",
    "piper_sdk==0.6.1",
    "pyrealsense2; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "python-can",
    "PyYAML",
    "scipy",
    "websockets",
]

[project.scripts]
challenge-deploy-openpi-client = "run_openpi_client:main"
challenge-deploy-xvla-client = "run_xvla_client:main"
challenge-deploy-openpi-sim-client = "run_openpi_sim_client:main"
challenge-deploy-motus-client = "run_motus_client:main"
challenge-deploy-dreamzero-client = "run_dreamzero_client:main"
challenge-deploy-fastwam-client = "run_fastwam_client:main"
challenge-deploy-hdf5_teleop-collect = "run_hdf5_teleop_collect:main"
challenge-deploy-hdf5_teleop-episode-vis = "run_hdf5_teleop_episode_vis:main"

[tool.setuptools]
py-modules = [
    "run_openpi_client",
    "run_xvla_client",
    "run_openpi_sim_client",
    "run_motus_client",
    "run_dreamzero_client",
    "run_fastwam_client",
    "run_hdf5_teleop_collect",
    "run_hdf5_teleop_episode_vis",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["clients*", "configs*", "data*", "hardware*", "rollout*", "teleop*"]

[tool.setuptools.package-data]
configs = ["*.yaml"]
