# Four independent USB-to-CAN adapters: one physical bus per arm.
#
# Local 4-CAN mapping confirmed 2026-09-23 by physical one-arm checks, not
# can0..can3 enumeration.
can_topology: isolated

robot:
  master_left:
    can_name: piper_ml
    usb_serial: "003C001E4148571320343133"
  master_right:
    can_name: piper_mr
    usb_serial: "002100284148570D20343133"
  slave_left:
    can_name: piper_sl
    usb_serial: "0041002A4148570C20343133"
    gripper_effort: 1000
  slave_right:
    can_name: piper_sr
    usb_serial: "002100235443571020393433"
    gripper_effort: 1000

cameras:
  enabled: true
  width: 640
  height: 480
  fps: 30
  warmup_frames: 30
  serials:
    cam_high: "344322073529"
    cam_right_wrist: "335522070790"
    cam_left_wrist: "344322073012"

policy:
  host: 127.0.0.1
  port: 8000
  prompt: fold the cloth
  inference_rate: 3.0
  chunk_size: 50
  latency_k: 8
  min_smooth_steps: 8
  buffer_max_chunks: 10

dataset:
  dataset_dir: ./artifacts/hdf5_data
  dataset_name: dummy_task
